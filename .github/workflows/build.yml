name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'reader/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '*.config.ts'
      - 'index.html'
      - 'tsconfig.json'
  pull_request:

permissions:
  contents: read

jobs:
  upstream:
    name: Resolve shacl-py main
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.reader.outputs.commit }}
    steps:
      - id: reader
        uses: actions/checkout@v4
        with:
          repository: Shavindra/shacl-py
          ref: main
          persist-credentials: false
      - name: Record the reader revision
        env:
          REVISION: ${{ steps.reader.outputs.commit }}
        run: echo "[shacl-py commit $REVISION](https://github.com/Shavindra/shacl-py/commit/$REVISION)" >> "$GITHUB_STEP_SUMMARY"
  desktop:
    name: ${{ matrix.label }}
    needs: upstream
    env:
      DS_VIEW_CI_SHACL_PY_COMMIT: ${{ needs.upstream.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS Apple Silicon
            artifact: DS-View-macOS-arm64
            bundle: dmg
            engine: webkit
            reader_python: ./.reader-build/venv/bin/python
          - os: windows-2022
            label: Windows x64
            artifact: DS-View-Windows-x64
            bundle: nsis
            engine: chromium
            reader_python: ./.reader-build/venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m unittest discover -s tests -p test_build_reader.py
      - name: Build the installer and check that the calling Python environment stays intact
        shell: bash
        run: |
          python -m pip freeze --all > "$RUNNER_TEMP/ds-view-host-packages.txt"
          npm run package -- --bundles ${{ matrix.bundle }}
          python -m pip freeze --all | diff -u "$RUNNER_TEMP/ds-view-host-packages.txt" -
      - run: ${{ matrix.reader_python }} -m unittest discover -s tests -p test_reader.py
      - run: npx playwright install ${{ matrix.engine }}
      - run: npm run test:ui -- --project ${{ matrix.engine }}
      - run: ${{ matrix.reader_python }} scripts/check_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*-setup.exe
